<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card UI Sample v1 (Community)</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <article class="post__card">
      <div class="post__card-info">
        <div class="post__card-info-people">
          <img class="avatar" src="images/avatar.svg" alt="avatar" />
          <div class="post__card-info-people text-decor">
            <p>Russell Ahmed</p>
            <p>Gazipur, Dhaka</p>
          </div>
        </div>
        <div>
          <button class="post__card-info-menu">
            <img src="images/pointers.svg" alt="menu" />
          </button>
        </div>
      </div>
      <div class="post">
        <img class="post__image" src="images/post.svg" />
      </div>
      <div class="post__actions">
        <div class="post__actions-left">
          <button class="action-btn">
            <img src="images/button1.svg" alt="comments" />
          </button>
          <button class="action-btn">
            <img src="images/button2.svg" alt="likes" />
          </button>
          <button class="action-btn">
            <img src="images/button3.svg" alt="send" />
          </button>
        </div>
        <div class="post__actions-right">
          <button class="action-btn">
            <img src="images/button4.svg" alt="save" />
          </button>
        </div>
      </div>
      <div class="likes__post">
        <p>Liked by <span class="bold-text">Safiqul Islam</span> and <span class="bold-text">210 others</span></p>
        <p>Friday, May 05,2023</p>
      </div>
    </article>
  </body>
</html>
